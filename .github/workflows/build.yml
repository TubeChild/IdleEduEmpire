name: Build and Release

# Builds on every push to main (smoke-test CI).
# On version tags (v*) also creates a GitHub Release and pushes to itch.io.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:

  # ── Linux build ────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pygame pyinstaller Pillow

      - name: Get version
        id: ver
        run: |
          VERSION=$(python -c "import re; m=re.search(r'VERSION\s*=\s*\"(.+?)\"', open('main.py').read()); print(m.group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        run: pyinstaller IdleEduEmpire.spec --clean -y

      - name: Zip
        run: |
          cd dist
          zip -r ../IdleEduEmpire-v${{ steps.ver.outputs.version }}-linux.zip IdleEduEmpire/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: IdleEduEmpire-v${{ steps.ver.outputs.version }}-linux.zip
          retention-days: 14

  # ── Windows build ──────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pygame pyinstaller Pillow

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path main.py -Pattern 'VERSION\s*=\s*"(.+?)"').Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: pyinstaller IdleEduEmpire.spec --clean -y

      - name: Zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist\IdleEduEmpire -DestinationPath "IdleEduEmpire-v$v-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: IdleEduEmpire-v${{ steps.ver.outputs.version }}-windows.zip
          retention-days: 14

  # ── Release (tags only) ────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-zip'
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --title "Idle Edu Empire v${VERSION}" \
            --notes "Download the zip for your platform, extract, and run **IdleEduEmpire** (Linux) or **IdleEduEmpire.exe** (Windows). Saves are stored in your user data folder and persist across updates." \
            "IdleEduEmpire-v${VERSION}-linux.zip" \
            "IdleEduEmpire-v${VERSION}-windows.zip"

      # ── itch.io upload ─────────────────────────────────────────────────
      # Requires two GitHub secrets:
      #   BUTLER_API_KEY  — from itch.io account settings → API keys
      #   ITCH_USER       — your itch.io username
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ secrets.ITCH_USER }}
          VERSION: ${{ needs.build-linux.outputs.version }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_USER" ]; then
            echo "Skipping itch.io upload: secrets not configured"
            exit 0
          fi
          BUTLER_URL=$(curl -s https://api.github.com/repos/itchio/butler/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if 'linux-amd64.zip' in a['name']))")
          curl -L -o butler.zip "$BUTLER_URL"
          unzip -q butler.zip -d butler-bin
          BUTLER=$(find butler-bin -type f | head -1)
          chmod +x "$BUTLER"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$BUTLER" push "IdleEduEmpire-v${VERSION}-linux.zip" \
            "${ITCH_USER}/idle-edu-empire:linux" --userversion "${VERSION}"
          "$BUTLER" push "IdleEduEmpire-v${VERSION}-windows.zip" \
            "${ITCH_USER}/idle-edu-empire:windows" --userversion "${VERSION}"
